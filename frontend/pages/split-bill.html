<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CryptoWallet - Split Bill</title>

    <link rel="stylesheet" href="../css/reports.css">

</head>


<body>

    <a href="#mainContent" class="skip-link">Skip to main content</a>


    <div class="app-page">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="brand">
                <div class="logo">₿</div>
                <span>Crypto<span>Wallet</span></span>
            </div>

            <nav>
                <a href="../index.html">◉ Dashboard</a>
                <a href="wallets.html">▣ Wallets</a>
                <a href="send.html">➤ Send</a>
                <a href="receive.html">⇩ Receive</a>
                <a href="exchange.html">⇄ Exchange</a>
                <a href="split-bill.html" class="active" aria-current="page">🧾 Split Bill</a>
                <a href="transactions.html">▤ Transactions</a>
                <a href="market.html">⌁ Market</a>
                <a href="reports.html">▥ Reports</a>
            </nav>

            <div class="sidebar-bottom">

                <button
                    type="button"
                    class="theme-toggle"
                    data-theme-toggle
                    aria-pressed="false"
                >
                    <span class="nav-icon icon-light" aria-hidden="true">☀</span>
                    <span class="nav-icon icon-dark" aria-hidden="true">🌙</span>
                    <span>Toggle dark mode</span>
                </button>

                <a href="settings.html">⚙ Settings</a>
                <a href="help.html">? Help & Support</a>
                <button id="logout">↪ Logout</button>
            </div>

        </aside>


        <!-- MAIN -->

        <main class="main" id="mainContent">

            <header class="header">
                <div>
                    <h1>Split Bill</h1>
                    <p>Split a bill with friends — everyone pays their own share.</p>
                </div>
                <div class="avatar" id="avatar">A</div>
            </header>


            <!-- CREATE A SPLIT -->

            <section class="card">

                <h2>Start a New Split</h2>

                <form id="createSplitForm">

                    <div class="form-group">
                        <label for="splitReceiverWallet">Collect Into Wallet</label>
                        <select id="splitReceiverWallet"></select>
                    </div>

                    <div class="form-group">
                        <label for="splitTitle">Title</label>
                        <input type="text" id="splitTitle" placeholder="e.g. Dinner at Cafe X" required>
                    </div>

                    <div class="form-group">
                        <label for="splitTotal">Total Bill Amount</label>
                        <input type="number" id="splitTotal" min="0.00000001" step="0.00000001" required>
                    </div>

                    <div class="form-group">

                        <label>Participants</label>

                        <div id="participantRows">
                            <!-- rows added by JS -->
                        </div>

                        <button type="button" id="addParticipantRowButton" style="margin-top:8px;">
                            + Add Participant
                        </button>

                    </div>

                    <small id="createSplitError" class="error"></small>

                    <button type="submit" class="primary-button" style="margin-top:12px;">
                        Create Split
                    </button>

                </form>

            </section>


            <!-- MY SPLITS -->

            <section class="card">

                <h2>My Splits</h2>

                <div id="splitList">
                    <p class="hint">Loading…</p>
                </div>

            </section>

        </main>

    </div>


    <div id="toast" class="toast"></div>


    <script src="../js/api.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/split-bill.js"></script>

</body>

</html>
