<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CryptoWallet - Login</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>

    <a href="#loginForm" class="skip-link">Skip to sign-in form</a>

    <button
        type="button"
        class="icon-button theme-toggle-floating"
        data-theme-toggle
        aria-pressed="false"
        aria-label="Toggle dark mode"
    >
        <span aria-hidden="true">🌓</span>
    </button>

    <main class="login-page">


        <!-- =========================================
             LEFT SIDE
        ========================================== -->

        <section class="login-brand">

            <div class="brand-content">

                <div class="brand">

                    <div class="brand-icon">
                        ₿
                    </div>

                    <span>
                        <span>CryptoWallet</span>
                    </span>

                </div>


                <div class="brand-text">

                    <h1>
                        <span>Your money.</span>
                        <br>
                        <span>Your control.</span>
                    </h1>

                    <p>
                        Manage fiat and cryptocurrency
                        from one secure platform.
                    </p>

                </div>

            </div>

        </section>



        <!-- =========================================
             RIGHT SIDE
        ========================================== -->

        <section class="login-section">

            <div class="login-container">


                <div class="login-header">

                    <h2>
                        Welcome Back
                    </h2>

                    <p>
                        Sign in to your CryptoWallet account
                    </p>

                </div>



                <!-- =================================
                     LOGIN FORM
                ================================== -->

                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                        <small
                            id="emailError"
                            class="error"
                        ></small>

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <small
                            id="passwordError"
                            class="error"
                        ></small>

                        <div class="forgot-password-row">

                            <a href="forgot-password.html">
                                Forgot password?
                            </a>

                        </div>

                    </div>



                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Sign In
                    </button>

                </form>



                <!-- =================================
                     CREATE ACCOUNT
                ================================== -->

                <div class="create-account">

                    <span>
                        Don't have an account?
                    </span>

                    <a href="create-account.html">
                        Create Account
                    </a>

                </div>



                <!-- =================================
                     GUEST
                ================================== -->

                <div class="guest-section">

                    <div class="divider">

                        <span>
                            OR
                        </span>

                    </div>


                    <button
                        type="button"
                        id="guestButton"
                        class="guest-button"
                    >
                        Continue as Guest
                    </button>

                </div>

            </div>

        </section>

    </main>



    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>



    <script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script src="js/login.js"></script>

</body>

</html>
