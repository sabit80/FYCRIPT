<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CryptoWallet - Pay</title>

    <link rel="stylesheet" href="css/base.css">

</head>


<body>

    <main style="max-width:420px;margin:60px auto;padding:0 20px;">

        <div class="card" style="padding:28px;">

            <div style="text-align:center;margin-bottom:20px;">
                <div style="font-size:36px;">₿</div>
                <strong>CryptoWallet</strong>
            </div>

            <div id="payLoading">Loading payment details…</div>

            <div id="payContent" style="display:none;">

                <h2 id="payTitle" style="margin-bottom:4px;"></h2>
                <p class="hint" id="payMerchant" style="margin-bottom:20px;"></p>

                <div class="form-group">
                    <label for="payWalletSelect">Pay From</label>
                    <select id="payWalletSelect"></select>
                </div>

                <div class="form-group" id="payAmountGroup">
                    <label for="payAmount">Amount</label>
                    <input type="number" id="payAmount" min="0.00000001" step="0.00000001">
                </div>

                <small id="payError" class="error"></small>

                <button id="payButton" class="primary-button" style="width:100%;margin-top:10px;">
                    Pay Now
                </button>

            </div>

            <div id="paySuccess" style="display:none;text-align:center;">

                <p style="font-size:40px;">✅</p>
                <h2>Payment Sent!</h2>
                <p class="hint">Thank you — your payment has been completed.</p>

            </div>

            <div id="payLoginRequired" style="display:none;text-align:center;">

                <p class="hint">Please log in to complete this payment.</p>
                <a href="login.html" class="primary-button" style="display:inline-block;text-decoration:none;">
                    Log In
                </a>

            </div>

        </div>

    </main>


    <script src="js/api.js"></script>
    <script src="js/pay.js"></script>

</body>

</html>
